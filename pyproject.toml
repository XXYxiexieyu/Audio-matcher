[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "audio-matcher"
version = "0.0.4"
description = "Audio identification, metadata tagging, and synced lyrics downloader"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "XXYxiexieyu"}]
keywords = ["audio", "fingerprint", "shazam", "lyrics", "tagging", "metadata"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
]

dependencies = [
    "shazamio>=0.8.0",
    "pyacoustid>=1.3",
    "mutagen>=1.47",
    "aiohttp>=3.9",
    "pydub>=0.25",
    "tqdm>=4.66",
    "ttkbootstrap>=1.10",
    "rich>=13.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[project.scripts]
audio-matcher = "audio_matcher.cli.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["audio_matcher*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/audio_matcher"]
